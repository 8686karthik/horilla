name: CI/CD Workflow

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: horilla_test
          POSTGRES_USER: horilla
          POSTGRES_PASSWORD: horilla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horilla -d horilla_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y netcat

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for DB
        run: |
          until nc -z localhost 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://horilla:horilla@localhost:5432/horilla_test
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://horilla:horilla@localhost:5432/horilla_test
        run: |
          python manage.py test --failfast

  docker_build:
    name: 📦 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: docker_build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Script
        run: |
          echo "Add deployment steps here (SSH, rsync, kubectl, etc.)"
